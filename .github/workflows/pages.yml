name: Render and deploy Quarto site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check GitHub Pages configuration
        id: pages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          response_file="$(mktemp)"
          status_code="$(
            curl --silent --show-error --location \
              --output "$response_file" \
              --write-out "%{http_code}" \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: ******" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages"
          )"

          if [ "$status_code" = "200" ]; then
            build_type="$(
              python -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("build_type", ""))' "$response_file"
            )"

            if [ "$build_type" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=GitHub Pages source is not GitHub Actions::Enable GitHub Pages in Settings > Pages and set Source to GitHub Actions before deployment."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$status_code" = "404" ]; then
            echo "::notice title=GitHub Pages is not enabled::Enable GitHub Pages in Settings > Pages and set Source to GitHub Actions before deployment."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "Unexpected response while checking GitHub Pages configuration (HTTP $status_code)." >&2
            cat "$response_file" >&2
            exit 1
          fi

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
