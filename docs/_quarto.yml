format:
  html:
    allow-html: true
    theme: 
      light: flatly
      dark: darkly
    grid:
      body-width: 1400px
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    page-layout: full
    html-math-method: mathjax
    execute:
      echo: false
    
editor: source